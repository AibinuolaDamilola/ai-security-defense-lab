rules:
  - id: cartbot-jwt-validation-disabled
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level3_cartbot/'
    message: >
      REQUIRE_JWT_VALIDATION is disabled. The API cannot cryptographically
      verify who a request actually belongs to, which directly enables
      Broken Object Level Authorization (OWASP API1:2023).
    metadata:
      owasp: "API1:2023 - Broken Object Level Authorization"
      cwe: "CWE-306: Missing Authentication for Critical Function"
      references:
        - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    patterns:
      - pattern: REQUIRE_JWT_VALIDATION = False

  - id: cartbot-customer-id-header-trusted
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level3_cartbot/'
    message: >
      TRUST_CUSTOMER_ID_HEADER is enabled. The API accepts a client-supplied
      customer_id at face value instead of verifying it against an
      authenticated session — this is the direct enabler of BOLA.
    metadata:
      owasp: "API1:2023 - Broken Object Level Authorization"
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      references:
        - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    patterns:
      - pattern: TRUST_CUSTOMER_ID_HEADER = True

  - id: cartbot-rate-limiting-disabled
    languages: [python]
    severity: WARNING
    paths:
      include:
        - '/fixtures/level3_cartbot/'
    message: >
      RATE_LIMIT_ENABLED is disabled. Without throttling, a scripted attacker
      can enumerate customer records and drive unbounded AI inference cost —
      a Denial of Wallet risk. See MITRE ATLAS AML.T0054.
    metadata:
      mitre-atlas: "AML.T0054 - LLM Data Exfiltration"
      cwe: "CWE-770: Allocation of Resources Without Limits or Throttling"
    patterns:
      - pattern: RATE_LIMIT_ENABLED = False

  - id: payguard-tenant-id-trusted
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level4_payguard/'
    message: >
      TRUST_CLIENT_TENANT_ID is enabled. The RAG system accepts a
      client-supplied tenant_id at face value with no session verification,
      allowing cross-tenant retrieval from the shared vector store.
    metadata:
      owasp: "LLM09:2026 - Vector and Embedding Weaknesses"
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
    patterns:
      - pattern: TRUST_CLIENT_TENANT_ID = True

  - id: payguard-metadata-filter-disabled
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level4_payguard/'
    message: >
      METADATA_FILTER_ENFORCED is disabled. The vector store has no
      per-tenant namespace or partition — every query can retrieve any
      client's documents regardless of who is asking.
    metadata:
      owasp: "LLM09:2026 - Vector and Embedding Weaknesses"
      cwe: "CWE-284: Improper Access Control"
    patterns:
      - pattern: METADATA_FILTER_ENFORCED = False

  - id: payguard-finetune-validation-disabled
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level4_payguard/'
    message: >
      VALIDATE_DATA_INTEGRITY is disabled in the fine-tuning pipeline. Training
      data flows from source to model with no integrity check, allowing a
      poisoned dataset to introduce a backdoor into the fine-tuned model.
    metadata:
      owasp: "LLM05:2026 - Data and Model Poisoning"
      cwe: "CWE-345: Insufficient Verification of Data Authenticity"
    patterns:
      - pattern: VALIDATE_DATA_INTEGRITY = False

  - id: payguard-rate-limiting-disabled
    languages: [python]
    severity: WARNING
    paths:
      include:
        - '/fixtures/level4_payguard/'
    message: >
      RATE_LIMIT_ENABLED is disabled on the vector store. A scripted attacker
      can drain the shared index across many simulated tenant_id values with
      no throttling — a Denial of Wallet risk at the retrieval layer.
    metadata:
      mitre-atlas: "AML.T0054 - LLM Data Exfiltration"
      cwe: "CWE-770: Allocation of Resources Without Limits or Throttling"
    patterns:
      - pattern: RATE_LIMIT_ENABLED = False

  - id: legalbot-finalize-permission-standing
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level5_legalbot/'
    message: >
      CAN_FINALIZE_DISMISSAL is enabled with no approval gate. The agent
      holds standing authority to take an irreversible administrative
      action, granting it more agency than its core task requires.
    metadata:
      owasp-agentic: "ASI03 - Identity & Privilege Abuse"
      cwe: "CWE-269: Improper Privilege Management"
    patterns:
      - pattern: CAN_FINALIZE_DISMISSAL = True

  - id: legalbot-approval-gate-disabled
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level5_legalbot/'
    message: >
      REQUIRE_HUMAN_APPROVAL is disabled. A hijacked agent goal can reach
      an irreversible action with no human checkpoint able to intercept it.
    metadata:
      owasp-agentic: "ASI02 - Tool Misuse & Exploitation"
      cwe: "CWE-862: Missing Authorization"
    patterns:
      - pattern: REQUIRE_HUMAN_APPROVAL = False

  - id: legalbot-citizen-input-not-sanitized
    languages: [python]
    severity: ERROR
    paths:
      include:
        - '/fixtures/level5_legalbot/'
    message: >
      SANITIZE_CITIZEN_INPUT is disabled. Citizen-submitted content is
      passed directly into the agent's context window with no separation
      between instructions and data, enabling Agent Goal Hijack.
    metadata:
      owasp-agentic: "ASI01 - Agent Goal Hijack"
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command"
    patterns:
      - pattern: SANITIZE_CITIZEN_INPUT = False
